services:
  db:
    image: mysql:8.0
    platform: linux/amd64
    command: --lower_case_table_names=1 --default-authentication-plugin=mysql_native_password --innodb-buffer-pool-size=32M --performance-schema=OFF --max-connections=30   # poca memoria: la base pesa ~5 MB
    environment:
      MYSQL_DATABASE: 'playa_db'
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}   # se toma del archivo .env (no se sube a GitHub)
    ports:
      - '127.0.0.1:3309:3306'   # solo dentro del servidor; para entrar: docker exec -it proy-alumbrado-db-1 mysql -uroot -p
    volumes:
      - ./data:/var/lib/mysql

  web:
    build: 
      context: .
    platform: linux/amd64
    ports:
      - "127.0.0.1:8085:8085"   # solo dentro del servidor: nginx lo publica con https
    volumes:
      - .:/code
    environment:
      - DATABASE_URL=mysql+mysqlconnector://root:${DB_ROOT_PASSWORD}@db/playa_db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8085   # sin --reload: tras cambiar el código, correr `docker compose restart web`
    restart: always
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    platform: linux/amd64
    ports:
      - "127.0.0.1:3000:80"   # solo dentro del servidor: nginx lo publica con https
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:8085
      - WDS_SOCKET_PORT=0
      - GENERATE_SOURCEMAP=false
    stdin_open: true
    tty: true
    depends_on:
      - web
      - db